<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ChamLing Welcome Screen</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#00B894",
              "background-light": "#FAFAFA",
              "background-dark": "#1E1E1E",
              "text-light": "#2D3436",
              "text-dark": "#F0F0F0"
            },
            fontFamily: {
              "display": ["Lexend", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display">
<div class="relative flex h-auto min-h-screen w-full flex-col group/design-root overflow-x-hidden bg-background-light dark:bg-background-dark">
<main class="flex flex-1 flex-col justify-between p-6">
<div class="flex-1"></div>
<div class="flex flex-col items-center justify-center space-y-8 flex-1">
<div class="flex h-32 w-32 items-center justify-center rounded-full bg-primary/20 text-primary">
<span class="material-symbols-outlined text-7xl">
                        translate
                    </span>
</div>
<div class="flex flex-col items-center gap-2 text-center">
<h1 class="text-text-light dark:text-text-dark tracking-light text-[32px] font-bold leading-tight">Master Vocabulary, Effortlessly.</h1>
<p class="text-text-light/80 dark:text-text-dark/80 text-base font-normal leading-normal max-w-xs">Your pocket language companion for learning on the go.</p>
</div>
</div>
<div class="flex-1 flex flex-col justify-end">
<div class="flex justify-center">
<button class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-xl h-14 px-5 flex-1 bg-primary text-white text-lg font-bold leading-normal tracking-[0.015em] shadow-lg shadow-primary/30 hover:shadow-primary/50 transition-shadow">
<span class="truncate">Get Started</span>
</button>
</div>
</div>
</main>
</div>
</body></html>
